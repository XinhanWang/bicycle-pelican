<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <title>gpt6astra · 今天，换你载我</title>
  <style>
    :root { color-scheme: light; --paper:#f6f5ef; --ink:#213f3c; --muted:#73827c; --line:#d8ded5; --panel:#fffef9; --accent:#d7e9a5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Segoe UI","Microsoft YaHei",sans-serif; transition:background .5s,color .5s; }
    button,input { font:inherit; }
    button { color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible,input:focus-visible { outline:3px solid #da6c46; outline-offset:5px; }
    button { touch-action:manipulation; }
    .page { max-width:1480px; padding:26px 48px 22px; margin:auto; }
    header { display:flex; align-items:center; justify-content:space-between; padding-bottom:21px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; letter-spacing:-.5px; }
    .brand svg { width:29px; height:29px; }
    .edition { font:11px/1.5 Consolas,monospace; letter-spacing:1.5px; color:var(--muted); }
    .intro { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding:30px 0 26px; }
    .eyebrow { font-size:11px; color:var(--muted); letter-spacing:3px; margin:0 0 11px; }
    h1 { font-size:clamp(28px,3.6vw,48px); font-weight:600; line-height:1.25; letter-spacing:-2px; margin:0; }
    h1 span { color:#dc785a; }
    .intro-note { margin:0 1px 2px 0; font-size:12px; color:var(--muted); line-height:1.9; text-align:right; }
    .stage { position:relative; overflow:hidden; border-radius:20px; isolation:isolate; background:#e1ede8; }
    .scene { display:block; width:100%; height:clamp(410px,53vh,650px); }
    .scene-tag { position:absolute; top:25px; left:28px; display:flex; align-items:center; gap:9px; font-size:10px; letter-spacing:2px; color:#43655c; }
    .dot { width:6px; height:6px; border-radius:50%; background:#668772; }
    .postmark { position:absolute; top:24px; right:28px; text-align:right; color:#537168; font:10px/1.8 Consolas,monospace; letter-spacing:1px; }
    .scene-caption { position:absolute; bottom:25px; left:28px; color:#365f55; font-size:11px; letter-spacing:2px; }
    .compass { position:absolute; bottom:23px; right:28px; display:flex; align-items:center; gap:12px; color:#365f55; font:10px Consolas,monospace; letter-spacing:1px; }
    .compass svg { width:33px; height:33px; }
    .toolbar { display:flex; align-items:center; gap:28px; margin-top:15px; padding:17px 21px; border:1px solid var(--line); border-radius:16px; background:var(--panel); }
    .play { width:42px; height:42px; border:0; border-radius:50%; background:var(--ink); color:var(--panel); display:grid; place-items:center; flex:none; }
    .play svg { width:18px; height:18px; }
    .play .resume-icon { display:none; }
    .play[aria-pressed="true"] .pause-icon { display:none; }
    .play[aria-pressed="true"] .resume-icon { display:block; }
    .playback { display:flex; align-items:center; gap:13px; min-width:150px; }
    .control-title { font-size:12px; font-weight:600; }
    .control-sub { font:10px/1.6 Consolas,monospace; color:var(--muted); margin-top:3px; }
    .speed { display:flex; align-items:center; gap:14px; padding-left:26px; border-left:1px solid var(--line); }
    .speed label { font-size:11px; white-space:nowrap; }
    .speed input { width:120px; accent-color:#497364; cursor:pointer; }
    .speed output { width:36px; font:11px Consolas,monospace; }
    .actions { display:flex; gap:10px; margin-left:auto; }
    .action { border:1px solid var(--line); padding:11px 17px; border-radius:9px; background:transparent; display:flex; align-items:center; justify-content:center; gap:9px; font-size:12px; white-space:nowrap; transition:transform .15s,background .2s; }
    .action:hover { transform:translateY(-2px); background:var(--paper); }
    .action svg { width:16px; height:16px; }
    .boost { border-color:transparent; background:var(--accent); color:#2d4938; }
    .boost:hover { background:#c9dfa0; }
    .boost:disabled { cursor:default; opacity:.7; transform:none; }
    footer { display:flex; justify-content:space-between; gap:20px; margin-top:21px; color:var(--muted); font-size:10px; letter-spacing:.7px; }
    footer .signature { font-family:Consolas,monospace; letter-spacing:1.4px; }
    .sky { fill:#e1ede8; transition:fill 1s; }
    .sea { fill:#b7d4c9; transition:fill 1s; }
    .distant-sea { fill:#cbdfd4; transition:fill 1s; }
    .wave { fill:none; stroke:#edf4e9; stroke-width:2; stroke-linecap:round; opacity:.65; }
    .cloud { fill:#f8f9ed; opacity:.82; }
    .stars { opacity:0; transition:opacity 1s; }
    #sun { opacity:1; transition:opacity 1s; }
    #moon { opacity:0; transition:opacity 1s; }
    body.night { color-scheme:dark; --paper:#142b31; --ink:#e4ecd9; --muted:#9eb7b6; --line:#355054; --panel:#1b363c; --accent:#cfdfa0; }
    .night .sky { fill:#284852; }
    .night .sea { fill:#203f4c; }
    .night .distant-sea { fill:#345661; }
    .night .cloud { fill:#729091; opacity:.3; }
    .night .wave { stroke:#628b94; opacity:.4; }
    .night .stars,.night #moon { opacity:1; }
    .night #sun { opacity:0; }
    .night .scene-tag,.night .postmark,.night .scene-caption,.night .compass { color:#d1e0cf; }
    .night .dot { background:#d7e9a5; }
    .night .speed input { accent-color:#d7e9a5; }
    @media (min-width:1700px) { .page { padding-top:40px; } }
    @media (max-width:850px) {
      .page { padding:20px 24px; } .intro { padding:25px 0; }
      .toolbar { gap:16px; padding:15px; flex-wrap:wrap; } .speed { padding-left:18px; }
      .speed input { width:95px; } .playback { min-width:130px; } .actions { gap:7px; } .action { padding:11px; }
    }
    @media (max-width:620px) {
      .page { padding:18px 16px; } header { padding-bottom:17px; } .edition { font-size:9px; letter-spacing:.5px; }
      .intro { display:block; padding:25px 0 20px; } .intro-note { text-align:left; margin:12px 0 0; } .intro-note br { display:none; }
      h1 { letter-spacing:-1px; font-size:32px; } .eyebrow { font-size:9px; }
      .scene { height:390px; } .stage { border-radius:15px; }
      .scene-tag { top:18px; left:17px; font-size:9px; letter-spacing:1px; } .postmark { top:16px; right:17px; font-size:8px; }
      .scene-caption { left:17px; bottom:20px; font-size:9px; letter-spacing:1px; } .compass { right:17px; bottom:16px; } .compass span { display:none; }
      .toolbar { gap:16px 8px; } .playback { flex:1; min-width:120px; } .speed { border:0; gap:6px; padding-left:0; } .speed input { width:78px; }
      .actions { width:100%; margin:0; } .action { flex:1; } footer { font-size:9px; line-height:1.8; } footer .signature { max-width:110px; text-align:right; }
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const ns = 'http://www.w3.org/2000/svg';
      const scene = document.querySelector('.scene');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = reduceMotion.matches;
      let night = false, speed = 1, time = 0, last = null, gustRemaining = 0;
      const refs = Object.fromEntries(['flight','bicycle','far-wing','near-wing','rear-spokes','front-spokes','crank','bike-ribbon','scarf','eye','closed-eye','shadow','jet-lines'].map(id => [id,$(id)]));
      const waves = [];
      for (let i = 0; i < 24; i++) {
        const path = document.createElementNS(ns,'path');
        const x = (i * 197) % 1500 - 150, y = 495 + (i * 31) % 140;
        const width = 25 + (i * 17) % 67;
        path.setAttribute('d',`M0 0q${width/4} -3 ${width/2} 0t${width/2} 0`);
        path.setAttribute('class','wave');
        $('waves').appendChild(path);
        waves.push({path,x,y,rate:12 + (y-490)*.13});
      }
      for (const [id,cx] of [['rear-spokes',459],['front-spokes',654]]) {
        for (let i = 0; i < 12; i++) {
          const angle = i * Math.PI / 6;
          const line = document.createElementNS(ns,'line');
          line.setAttribute('x1',cx); line.setAttribute('y1',310);
          line.setAttribute('x2',cx + Math.cos(angle)*50);
          line.setAttribute('y2',310 + Math.sin(angle)*50);
          $(id).appendChild(line);
        }
      }
      function updateControls() {
        $('play').setAttribute('aria-pressed',String(paused));
        $('play').setAttribute('aria-label',paused ? '播放动画' : '暂停动画');
        $('play-label').textContent = paused ? '把风景留一会儿' : '让风继续吹';
        document.querySelector('.control-sub').textContent = paused ? 'SPACE TO PLAY' : 'SPACE TO PAUSE';
        $('flight-status').textContent = paused ? '片刻停留 · 风景正好' : gustRemaining > 0 ? '顺风而行 · 好风借力' : night ? '正在夜航 · 披星戴月' : '正在漫游 · 无需目的地';
        $('boost').disabled = paused || gustRemaining > 0;
        $('boost-label').textContent = gustRemaining > 0 ? '风来啦…' : '乘风加速';
      }
      function togglePlayback() { paused = !paused; updateControls(); }
      function toggleTheme() {
        night = !night;
        document.body.classList.toggle('night',night);
        $('theme').setAttribute('aria-pressed',String(night));
        $('theme-label').textContent = night ? '回到白昼' : '切换夜航';
        document.querySelector('meta[name="theme-color"]').content = night ? '#142b31' : '#f6f5ef';
        updateControls();
      }
      function draw(t) {
        const bob = Math.sin(t*1.8)*8;
        const flap = Math.sin(t*3.5);
        refs.flight.setAttribute('transform',`translate(0 ${bob}) rotate(${Math.sin(t*.9)*1.2} 610 380)`);
        refs.bicycle.setAttribute('transform',`rotate(${Math.sin(t*1.8+.4)*.7} 558 366)`);
        refs['far-wing'].setAttribute('transform',`rotate(${-10-flap*17} 622 409)`);
        refs['near-wing'].setAttribute('transform',`rotate(${flap*17} 655 415)`);
        refs['rear-spokes'].setAttribute('transform',`rotate(${t*115%360} 459 310)`);
        refs['front-spokes'].setAttribute('transform',`rotate(${t*115%360} 654 310)`);
        refs.crank.setAttribute('transform',`rotate(${t*85%360} 558 309)`);
        refs['bike-ribbon'].setAttribute('transform',`rotate(${Math.sin(t*5)*5} 649 168)`);
        refs.scarf.setAttribute('transform',`rotate(${Math.sin(t*5+1)*5} 722 360)`);
        const blink = t % 5.7 > 5.5;
        refs.eye.setAttribute('opacity',blink ? '0' : '1');
        refs['closed-eye'].setAttribute('opacity',blink ? '1' : '0');
        refs.shadow.setAttribute('rx',183 + bob*1.3);
        refs.shadow.setAttribute('opacity',.12 + bob*.002);
        refs['jet-lines'].setAttribute('opacity',gustRemaining > 0 ? .55 + Math.sin(t*15)*.25 : 0);
        const clouds = [['cloud-a',156,170,1.3,8],['cloud-b',982,282,.85,12],['cloud-c',523,98,.65,5]];
        for (const [id,x,y,scale,rate] of clouds) $(id).setAttribute('transform',`translate(${((x+200-t*rate)%1600+1600)%1600-200} ${y}) scale(${scale})`);
        for (const w of waves) w.path.setAttribute('transform',`translate(${((w.x+200-t*w.rate)%1600+1600)%1600-200} ${w.y})`);
      }
      function frame(now) {
        const dt = last === null ? 0 : Math.min((now-last)/1000,.05);
        last = now;
        if (!paused && !document.hidden) {
          time += dt * speed * (gustRemaining > 0 ? 2.5 : 1);
          if (gustRemaining > 0) { gustRemaining = Math.max(0,gustRemaining-dt); if (gustRemaining === 0) updateControls(); }
          draw(time);
        }
        requestAnimationFrame(frame);
      }
      function fitScene() {
        // A closer portrait crop keeps the complete bicycle and bill in view on phones.
        scene.setAttribute('viewBox',window.innerWidth <= 620 ? '250 20 770 680' : '0 0 1200 640');
      }
      $('play').addEventListener('click',togglePlayback);
      $('theme').addEventListener('click',toggleTheme);
      $('speed').addEventListener('input',event => {
        speed = Number(event.target.value);
        $('speed-value').value = `${speed.toFixed(2)}×`;
        event.target.setAttribute('aria-valuetext',`${speed} 倍速`);
      });
      $('boost').addEventListener('click',() => { if (!paused && gustRemaining === 0) { gustRemaining = 3; updateControls(); } });
      document.addEventListener('keydown',event => {
        if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || /INPUT|TEXTAREA|SELECT|BUTTON/.test(event.target.tagName) || event.target.isContentEditable) return;
        if (event.code === 'Space') { event.preventDefault(); togglePlayback(); }
        if (event.key.toLowerCase() === 'n') toggleTheme();
      });
      document.addEventListener('visibilitychange',() => { last = null; });
      reduceMotion.addEventListener('change',event => { if (event.matches) { paused = true; updateControls(); } });
      window.addEventListener('resize',fitScene);
      fitScene(); updateControls(); draw(0); requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
